name: Obsidian plugin release

# Builds the Obsidian plugin and publishes a GitHub release.
#
# Push a tag that matches the version in obsidian-plugin/manifest.json:
#   git tag plugin-v0.2.3 && git push origin plugin-v0.2.3
#
# The release contains the three files Obsidian/BRAT expect on the latest release
# (main.js, manifest.json, styles.css) plus a ready-to-copy zip.

on:
  push:
    tags: ['plugin-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Read version and verify the bundle
        id: pkg
        run: |
          set -euo pipefail
          version=$(jq -r .version manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for file in main.js manifest.json styles.css; do
            if [ ! -s "dist/$file" ]; then
              echo "dist/$file is missing or empty" >&2
              exit 1
            fi
          done
          ls -l dist

      - name: Check the tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        run: |
          set -euo pipefail
          expected="plugin-v${{ steps.pkg.outputs.version }}"
          if [ "$expected" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match manifest.json version (expected $expected)" >&2
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          (cd dist && zip -r "../meisync-obsidian-${{ steps.pkg.outputs.version }}.zip" .)
          ls -l meisync-obsidian-*.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meisync-obsidian-${{ steps.pkg.outputs.version }}
          path: obsidian-plugin/meisync-obsidian-*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/plugin-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obsidian-plugin/dist/main.js
            obsidian-plugin/dist/manifest.json
            obsidian-plugin/dist/styles.css
            obsidian-plugin/meisync-obsidian-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
